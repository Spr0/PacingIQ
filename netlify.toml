# Netlify build + SPA routing config for PacingIQ
[build]
  command = "npm run build"
  publish = "dist"

# Serverless functions (AI Coaching Assistant, attachment storage). Environment
# variables set in the Netlify site settings:
#   ANTHROPIC_API_KEY   - your Anthropic API key
#   ANTHROPIC_MODEL     - e.g. claude-opus-4-8 (no default; missing config fails loudly)
#
# Optional:
#   ANTHROPIC_READER_MODEL - used by calendar-reader and lesson-reader only.
#     Falls back to ANTHROPIC_MODEL when unset, so the split is opt-in and
#     removing the variable reverts it. Reading a calendar is structured
#     extraction the coach reviews row by row before importing, and it is
#     almost all of the volume (a year-long PDF is dozens of calls; a coaching
#     report is one), so it is the right place for a cheaper, faster model.
#     coach-assist stays on ANTHROPIC_MODEL because it writes prose a principal
#     reads. Speed is the real argument: the ~26s function budget is the binding
#     constraint, and each timeout triggers a bisect whose retries are paid
#     calls, so a faster model cuts failures and cost together. Confirm which
#     model actually ran via the usage report grouped by model.
#   VITE_SUPABASE_URL   - already set for the browser build; the functions reuse it
#   VITE_SUPABASE_ANON_KEY - likewise
#
# Every function verifies the caller's Supabase session against those last two
# (netlify/functions/_shared/auth.js). They must stay scoped to Functions -- if
# they stop resolving, every function returns 500 rather than serving an
# unauthenticated request. SUPABASE_URL / SUPABASE_ANON_KEY are read first if
# set, so the pair can be split later without a code change.
#
# Deliberately the anon key, never the service-role key: these functions must
# not be able to do more than the signed-in user could.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Function routes are resolved before redirects, so the SPA catch-all below does
# not shadow /.netlify/functions/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
